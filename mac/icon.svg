<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 1024 canvas, 824x824 body at (100,100), soft drop shadow.
       Same artwork as web/icon.svg, scaled into the grid so it matches other Dock icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8865C"/>
      <stop offset="1" stop-color="#C4572F"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#FFE0BF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(1.609375)">
    <rect width="512" height="512" rx="116" fill="url(#bg)" filter="url(#shadow)"/>
    <path d="M256 104c18 58 92 96 92 186a92 92 0 0 1-184 0c0-46 24-74 46-96 4 34 20 52 40 58-12-50 2-104 6-148z" fill="url(#flame)"/>
    <path d="M256 290c10 22 36 34 36 64a36 36 0 0 1-72 0c0-22 16-36 36-64z" fill="#E8865C" opacity=".85"/>
    <rect x="148" y="404" width="216" height="20" rx="10" fill="#FFF6E8" opacity=".9"/>
  </g>
</svg>
