<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up Hearth</title>
<style>
  :root { --bg:#fbfaf8; --card:#fff; --line:#ebe8e3; --ink:#1d1b19; --muted:#8c8781; --ok:#2f9e6b; --warn:#d98a1c; --danger:#d9534f; --blue:#2f6feb;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--font); -webkit-font-smoothing:antialiased; }
  main { max-width:620px; margin:0 auto; padding:44px 28px 60px; }
  .dots { display:flex; gap:6px; margin-bottom:28px; } .dots i { width:26px; height:4px; border-radius:2px; background:var(--line); } .dots i.on { background:var(--ink); }
  h1 { font-size:26px; letter-spacing:-.02em; margin:0 0 6px; } p.sub { color:var(--muted); margin:0 0 24px; }
  .opt { display:flex; align-items:center; gap:14px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; user-select:none; }
  .opt:hover { border-color:#d6d1ca; } .opt.on { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; } .opt.off { opacity:.5; cursor:default; }
  .box { width:22px; height:22px; border-radius:6px; border:1.5px solid #cfc9c1; flex:none; display:grid; place-items:center; font-size:14px; color:#fff; }
  .opt.on .box { background:var(--ink); border-color:var(--ink); } .radio .box { border-radius:50%; }
  .logo { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font-weight:700; color:#fff; flex:none; }
  .name { font-weight:600; } .meta { color:var(--muted); font-size:13px; } .grow { flex:1; min-width:0; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:#eef7f2; color:var(--ok); white-space:nowrap; } .pill.w { background:#fbf3e6; color:var(--warn); } .pill.x { background:#f4f2ef; color:var(--muted); }
  .form { display:none; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 16px 14px; margin:-2px 0 12px; }
  .form.show { display:block; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=email], input[type=password] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; outline:none; }
  label.file { margin:0; font-size:15px; cursor:pointer; } .file { display:flex; align-items:center; gap:12px; border:1px dashed #d6d1ca; border-radius:10px; padding:8px 8px 8px 12px; background:#fff; }
  .file .fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); } .file .fname.set { color:var(--ink); }
  .file input { display:none; }
  button.second, span.second { font-weight:600; cursor:pointer; background:#f1eee9; color:var(--ink); padding:8px 14px; border-radius:8px; white-space:nowrap; }
  .opt-l { color:#b3ada6; } .hint { font-size:12px; color:var(--muted); margin-top:5px; }
  input:focus { border-color:var(--ink); } .row { display:flex; gap:10px; } .row > div { flex:1; }
  .check { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin-top:12px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:26px; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:12px 20px; background:var(--ink); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); padding-left:0; } button:disabled { opacity:.35; cursor:default; }
  .err { color:var(--danger); font-size:14px; min-height:20px; margin-top:12px; }
  .steps { list-style:none; padding:0; margin:0; } .steps li { display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
  .steps .i { width:20px; flex:none; text-align:center; } .steps .ok .i { color:var(--ok); } .steps .warn .i { color:var(--warn); } .steps .fail .i { color:var(--danger); }
  .steps .start .i::after { content:""; display:inline-block; width:12px; height:12px; border:2px solid #cfc9c1; border-top-color:var(--ink); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .log { font:12px/1.5 var(--mono); color:var(--muted); background:#f4f2ef; border-radius:10px; padding:10px 12px; max-height:150px; overflow:auto; margin-top:14px; white-space:pre-wrap; display:none; }
  .qr { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; width:240px; margin:8px auto 14px; } .qr svg { width:100%; height:auto; display:block; }
  .center { text-align:center; } .link { font:12px var(--mono); color:var(--muted); word-break:break-all; }
  .warnbox { background:#fbf3e6; border-radius:12px; padding:12px 14px; font-size:13px; color:#7a5313; margin-top:12px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = "__WIZARD_KEY__";
const api = (p, body) => fetch(p + (p.includes("?") ? "&" : "?") + "k=" + KEY, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}).then((r) => r.json());
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const S = { step: 0, brains: [], picked: new Set(), where: "local", f: { host: "", user: "ubuntu", key: "", keyName: "", domain: "", email: "", skipDns: false, lan: false }, steps: [], result: null };
const COLORS = { claude: "#d97757", codex: "#000" };
// Claude and OpenAI marks: Simple Icons (CC0) paths, 24x24.
const MARKS = {
  claude: "m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z",
  codex: "M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z",
};
const mark = (id) => `<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#fff" d="${MARKS[id]}"/></svg>`;
const dots = (n) => `<div class="dots">${[0, 1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;

async function start() {
  S.brains = (await api("/brains")).brains;
  for (const b of S.brains) if (b.installed && b.loggedIn) S.picked.add(b.id);
  draw();
}

function draw() { $("#app").innerHTML = [brainsView, whereView, runView, doneView][S.step](); bind(); }

function brainsView() {
  return `${dots(0)}<h1>Who do you want the brain to be?</h1>
  <p class="sub">Pick one or both. With both, each job goes to whichever has the most room on its plan right now.</p>
  ${S.brains.map((b) => {
    const usable = b.installed;
    const pill = !b.installed ? `<span class="pill x">Not installed</span>` : b.loggedIn ? `<span class="pill">Signed in</span>` : `<span class="pill w">Not signed in</span>`;
    return `<div class="opt ${S.picked.has(b.id) ? "on" : ""} ${usable ? "" : "off"}" data-brain="${b.id}">
      <div class="box">${S.picked.has(b.id) ? "✓" : ""}</div>
      <div class="logo" style="background:${COLORS[b.id]}">${mark(b.id)}</div>
      <div class="grow"><div class="name">${esc(b.label)}</div><div class="meta">${b.installed ? `${esc(b.version || "")}${b.loggedIn ? ` · ${esc(b.how)}` : ` · run <code>${b.id === "claude" ? "claude" : "codex login"}</code> once in Terminal`}` : b.id === "claude" ? "Install: curl -fsSL https://claude.ai/install.sh | bash" : "Install: npm install -g @openai/codex"}</div></div>
      ${pill}</div>`;
  }).join("")}
  <div class="err" id="err"></div>
  <div class="bar"><button class="ghost" id="rescan">Detect again</button><button id="next" ${S.picked.size ? "" : "disabled"}>Continue</button></div>`;
}

function whereView() {
  const f = S.f;
  return `${dots(1)}<h1>Where should your hub live?</h1>
  <p class="sub">The hub is where Hearth thinks, remembers and runs your reminders. Your phone talks to it.</p>
  <div class="opt radio ${S.where === "local" ? "on" : ""}" data-where="local"><div class="box"></div>
    <div class="grow"><div class="name">This Mac</div><div class="meta">Uses the logins already on this Mac. Works while it's awake.</div></div></div>
  <div class="form ${S.where === "local" ? "show" : ""}">
    <div class="check"><input type="checkbox" id="lan" ${f.lan ? "checked" : ""}><span>Let my phone reach it on this Wi-Fi (plain http, so only on a network you trust)</span></div>
  </div>
  <div class="opt radio ${S.where === "remote" ? "on" : ""}" data-where="remote"><div class="box"></div>
    <div class="grow"><div class="name">My server</div><div class="meta">Always on, at your own domain, with HTTPS. AWS Lightsail or any Ubuntu box.</div></div></div>
  <div class="form ${S.where === "remote" ? "show" : ""}">
    <label>Domain</label><input type="text" id="domain" placeholder="assistant.example.com" value="${esc(f.domain)}" autocapitalize="off" spellcheck="false">
    <div class="row"><div><label>Server IP</label><input type="text" id="host" placeholder="203.0.113.10" value="${esc(f.host)}" spellcheck="false"></div>
      <div><label>SSH user</label><input type="text" id="user" value="${esc(f.user)}" spellcheck="false"></div></div>
    <label>SSH key</label>
    <label class="file" for="keyFile"><span class="fname ${f.keyName ? "set" : ""}">${f.keyName ? esc(f.keyName) : "No file chosen (uses your usual SSH keys)"}</span><span class="second button">${f.keyName ? "Change" : "Choose file"}</span><input type="file" id="keyFile"></label>
    <div class="hint">The private key for the server, like the .pem Lightsail gave you.</div>
    <label>Email <span class="opt-l">(optional)</span></label><input type="email" id="email" placeholder="you@example.com" value="${esc(f.email)}">
    <div class="hint">Only Let's Encrypt sees it, to warn you if your HTTPS certificate ever fails to renew. Leave it empty and everything still works.</div>
    <div class="check"><input type="checkbox" id="skipDns" ${f.skipDns ? "checked" : ""}><span>The domain isn't pointing at the server yet; set up anyway</span></div>
    ${S.picked.has("claude") ? `<div class="warnbox">Claude on the server signs in with a long-lived login made on this Mac (<code>claude setup-token</code>): a browser opens once for you to approve.${S.picked.has("codex") ? " Codex's login is copied from this Mac." : ""}</div>` : S.picked.has("codex") ? `<div class="warnbox">Codex's login is copied from this Mac to the server.</div>` : ""}
  </div>
  <div class="err" id="err"></div>
  <div class="bar"><button class="ghost" id="back">Back</button><button id="next">Set up</button></div>`;
}

function runView() {
  const main = S.steps.filter((s) => s.state !== "log" && s.step !== "end");
  const byStep = new Map(); for (const s of main) byStep.set(s.step, s);
  const logs = S.steps.filter((s) => s.state === "log" && s.text).slice(-60).map((s) => esc(s.text)).join("\n");
  const failed = main.some((s) => s.state === "fail");
  return `${dots(2)}<h1>${failed ? "Setup stopped" : "Setting up…"}</h1><p class="sub">${S.where === "remote" ? esc(S.f.domain) : "This Mac"}</p>
  <ul class="steps">${[...byStep.values()].map((s) => `<li class="${s.state}"><span class="i">${{ ok: "✓", warn: "!", fail: "✗", done: "★", start: "" }[s.state] ?? ""}</span><span>${esc(s.text)}</span></li>`).join("")}</ul>
  <div class="log" id="log" style="${logs ? "display:block" : ""}">${logs}</div>
  ${failed ? `<div class="bar"><button class="ghost" id="back">Back</button><button id="retry">Try again</button></div>` : ""}`;
}

function doneView() {
  const r = S.result || {};
  return `${dots(3)}<h1>Hearth is ready</h1>
  <p class="sub">${r.pair ? "Scan this with your phone's camera. That phone becomes your primary device: it approves every other device, like a router's admin." : "Your hub is running."}</p>
  ${r.pair ? `<div class="qr" id="qr"></div><div class="center link">${esc(r.pair)}</div>` : ""}
  <p class="sub" style="margin-top:22px">Next, add your connectors (Serper, Deepgram, WhatsApp, Slack, Instagram, LinkedIn) from the grid in Settings → Connectors.</p>
  <div class="bar"><span></span><button id="open">${r.pair && S.where === "local" ? "Use Hearth on this Mac" : "Open Hearth"}</button></div>`;
}

function bind() {
  document.querySelectorAll("[data-brain]").forEach((el) => el.onclick = () => {
    const b = S.brains.find((x) => x.id === el.dataset.brain); if (!b?.installed) return;
    S.picked.has(b.id) ? S.picked.delete(b.id) : S.picked.add(b.id); draw();
  });
  document.querySelectorAll("[data-where]").forEach((el) => el.onclick = () => { save(); S.where = el.dataset.where; draw(); });
  $("#rescan") && ($("#rescan").onclick = start);
  $("#back") && ($("#back").onclick = () => { save(); S.step = Math.max(0, S.step === 2 ? 1 : S.step - 1); draw(); });
  $("#retry") && ($("#retry").onclick = install);
  $("#keyFile") && ($("#keyFile").onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    save();
    const r = await api("/key", { name: file.name, text: await file.text() });
    if (r.error) { $("#err").textContent = r.error; return; }
    S.f.key = r.path; S.f.keyName = file.name; draw();
  });
  if (S.step === 0 && $("#next")) $("#next").onclick = () => { S.step = 1; draw(); };
  if (S.step === 1 && $("#next")) $("#next").onclick = async () => {
    save();
    const r = await api("/check", payload());
    if (r.error) { $("#err").textContent = r.error; return; }
    install();
  };
  if (S.step === 3) {
    const r = S.result || {};
    if (r.pair) api("/qr?text=" + encodeURIComponent(r.pair)).then((q) => { $("#qr").innerHTML = q.svg; });
    $("#open").onclick = () => { location.href = (S.where === "local" && r.pair) ? r.pair : r.url; };
  }
  const log = $("#log"); if (log) log.scrollTop = log.scrollHeight;
}

function save() {
  for (const k of ["host", "user", "domain", "email"]) { const el = $("#" + k); if (el) S.f[k] = el.value.trim(); }
  for (const k of ["skipDns", "lan"]) { const el = $("#" + k); if (el) S.f[k] = el.checked; }
}
const payload = () => ({ where: S.where, brains: [...S.picked].join(","), ...S.f });

async function install() {
  S.step = 2; S.steps = []; draw();
  const { id } = await api("/install", payload());
  const es = new EventSource(`/install/${id}/events?k=${KEY}`);
  es.onmessage = (e) => {
    const s = JSON.parse(e.data);
    if (s.step === "end") { es.close(); return; }
    S.steps.push(s);
    if (s.state === "done") { S.result = s.data; S.step = 3; es.close(); }
    draw();
  };
}

start();
</script>
</body>
</html>
